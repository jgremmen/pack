plugins {
  id 'java-library'
  id 'com.adarshr.test-logger' version '4.0.0'
}


description = 'Java Pack Library'
group = 'de.sayayi.lib'
version = libs.versions.pack.get()


layout.buildDirectory = '.build'


configurations {
  optionalApi

  compileOnlyApi.extendsFrom(optionalApi)
}


java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }

  withSourcesJar()
  withJavadocJar()
}


test {
  useJUnitPlatform()

  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}



sourceSets {
  // additional source set providing classes compiled against Apache Tika 3
  tika3
  tika3Test {
    compileClasspath += sourceSets.main.output + sourceSets.tika3.output
    runtimeClasspath += sourceSets.main.output + sourceSets.tika3.output
  }

  // additional source set providing classes compiled against Apache Tika 4
  tika4
  tika4Test {
    compileClasspath += sourceSets.main.output + sourceSets.tika4.output
    runtimeClasspath += sourceSets.main.output + sourceSets.tika4.output
  }
}


tasks.register('tika3Test', Test) {
  description = 'Runs unit tests for classes compiled against Apache Tika 3.'
  group = 'verification'

  testClassesDirs = sourceSets.tika3Test.output.classesDirs
  classpath = sourceSets.tika3Test.runtimeClasspath

  useJUnitPlatform()

  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}


tasks.register('tika4Test', Test) {
  description = 'Runs unit tests for classes compiled against Apache Tika 4.'
  group = 'verification'

  testClassesDirs = sourceSets.tika4Test.output.classesDirs
  classpath = sourceSets.tika4Test.runtimeClasspath

  useJUnitPlatform()

  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}


check.dependsOn tika3Test
check.dependsOn tika4Test


testlogger {
  theme = 'mocha'
  slowThreshold = 2500
}


repositories {
  mavenCentral()
}


dependencies {
  // java
  compileOnlyApi libs.jetbrains.annotations

  // tika-core is required (optionally, at compile time only) by the module descriptor (module-info.java), since the
  // Tika detector classes compiled in the tika3/tika4 source sets are packaged into this very module. Published as
  // an optional dependency using a joint version range spanning both Apache Tika 3 and 4, since consumers may bring
  // either version depending on which detector class (AbstractTikaDetector or AbstractTika4Detector) they use.
  optionalApi(libs.tika.core.full)

  tika3CompileOnly sourceSets.main.output
  tika3CompileOnly libs.jetbrains.annotations
  tika3CompileOnly libs.tika.core

  tika4CompileOnly sourceSets.main.output
  tika4CompileOnly libs.jetbrains.annotations
  tika4CompileOnly libs.tika4.core

  // test
  testImplementation libs.junit.jupiter.api
  testImplementation libs.junit.jupiter.params
  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testImplementation libs.tika.core

  tika3TestImplementation libs.junit.jupiter.api
  tika3TestImplementation libs.junit.jupiter.params
  tika3TestImplementation libs.tika.core
  tika3TestRuntimeOnly libs.junit.jupiter.engine
  tika3TestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  tika4TestImplementation libs.junit.jupiter.api
  tika4TestImplementation libs.junit.jupiter.params
  tika4TestImplementation libs.tika4.core
  tika4TestRuntimeOnly libs.junit.jupiter.engine
  tika4TestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


def resolvedJetbrainsAnnotationsVersion = configurations
    .compileClasspath
    .resolvedConfiguration
    .resolvedArtifacts
    .find { it.name == 'annotations' }
    .moduleVersion.id.version
def resolvedTika3Version = configurations
    .tika3CompileClasspath
    .resolvedConfiguration
    .resolvedArtifacts
    .find { it.name == 'tika-core' }
    .moduleVersion.id.version
def resolvedTika4Version = configurations
    .tika4CompileClasspath
    .resolvedConfiguration
    .resolvedArtifacts
    .find { it.name == 'tika-core' }
    .moduleVersion.id.version


javadoc {
  source += sourceSets.tika3.allJava
  source += sourceSets.tika4.allJava

  classpath += sourceSets.tika3.compileClasspath
  classpath += sourceSets.tika4.compileClasspath

  title = "Java Pack Library ${version}"

  (options as StandardJavadocDocletOptions).with {
    linksOffline "https://javadoc.io/doc/org.jetbrains/annotations/${resolvedJetbrainsAnnotationsVersion}/",
                 'gradle/javadocs/jetbrains-annotations'
    linksOffline "https://javadoc.io/doc/org.apache.tika/tika-core/${resolvedTika3Version}/",
                 'gradle/javadocs/tika3-core'
    linksOffline "https://javadoc.io/doc/org.apache.tika/tika-core/${resolvedTika4Version}/",
                 'gradle/javadocs/tika4-core'

    encoding = 'UTF-8'

    noQualifiers 'java.util', 'java.lang'

    addStringOption('Xdoclint:-missing', '-quiet')
  }

  failOnError = false
}


tasks.withType(Jar).configureEach {
  reproducibleFileOrder = true

  manifest {
    attributes(
        'Implementation-Vendor': 'Jeroen Gremmen',
        'Implementation-Vendor-Id': 'de.sayayi',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Created-By': System.getProperty('java.version'),
        'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss')
    )
  }

  metaInf {
    from files('LICENSE')
  }
}


jar {
  dependsOn test
  dependsOn tika3Test
  dependsOn tika4Test

  from sourceSets.tika3.output
  from sourceSets.tika4.output
}


tasks.named('sourcesJar') {
  from sourceSets.tika3.allJava
  from sourceSets.tika4.allJava
}


apply from: file('gradle/publish.gradle')


clean {
  delete layout.projectDirectory.dir('build')
}


wrapper {
  distributionType = Wrapper.DistributionType.BIN
}
