plugins {
  id 'java-library'
  id 'com.adarshr.test-logger' version '4.0.0'
}


description = 'Java Pack Library'
group = 'de.sayayi.lib'
version = libs.versions.pack.get()


layout.buildDirectory = '.build'


configurations {
  optionalApi

  compileOnlyApi.extendsFrom(optionalApi)
}


java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }

  withSourcesJar()
  withJavadocJar()
}


test {
  useJUnitPlatform()

  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}


testlogger {
  theme = 'mocha'
  slowThreshold = 2500
}


repositories {
  mavenCentral()
}


dependencies {
  // java
  compileOnlyApi libs.jetbrains.annotations

  optionalApi(libs.tika.core) {
    transitive = false
  }

  // test
  testImplementation libs.junit.jupiter.api
  testImplementation libs.junit.jupiter.params
  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testImplementation libs.tika.core
}


def resolvedJetbrainsAnnotationsVersion = configurations
    .compileClasspath
    .resolvedConfiguration
    .resolvedArtifacts
    .find { it.name == 'annotations' }
    .moduleVersion.id.version
def resolvedTikaVersion = configurations
    .compileClasspath
    .resolvedConfiguration
    .resolvedArtifacts
    .find { it.name == 'tika-core' }
    .moduleVersion.id.version


javadoc {
  title = "Java Pack Library ${version}"

  (options as StandardJavadocDocletOptions).with {
    linksOffline "https://javadoc.io/doc/org.jetbrains/annotations/${resolvedJetbrainsAnnotationsVersion}/",
                 'gradle/javadocs/jetbrains-annotations'
    linksOffline "https://javadoc.io/doc/org.apache.tika/tika-core/${resolvedTikaVersion}/",
                 'gradle/javadocs/tika-core'

    encoding 'UTF-8'

    noQualifiers 'java.util', 'java.lang'

    addStringOption('Xdoclint:-missing', '-quiet')
  }

  failOnError = false
}


tasks.withType(Jar).configureEach {
  reproducibleFileOrder = true

  manifest {
    attributes(
        'Implementation-Vendor': 'Jeroen Gremmen',
        'Implementation-Vendor-Id': 'de.sayayi',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Created-By': System.getProperty('java.version'),
        'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss')
    )
  }

  metaInf {
    from files('LICENSE')
  }
}


jar.dependsOn test


apply from: file('gradle/publish.gradle')


clean {
  delete layout.projectDirectory.dir('build')
}


wrapper {
  distributionType = Wrapper.DistributionType.BIN
}
