[versions]
# pack version
pack = '0.3.2'

jetbrains-annotations = '[19.0,26.2)'
junit = '6.1.+'
tika = '[1.19,4.0)'
tika4 = '[4.0,5.0)'
tika-full = '[1.19,5.0)'  # full version range spanning both tika (3.x) and tika4 (4.x) for pom publication

# gradle plugins
publish-on-central = '9.3.1'
test-logger = '4.0.0'

[libraries]
jetbrains-annotations = { group = 'org.jetbrains', name = 'annotations', version.ref = 'jetbrains-annotations' }

junit-bom = { group = 'org.junit', name = 'junit-bom', version.ref = 'junit' }
junit-jupiter-api = { group = 'org.junit.jupiter', name = 'junit-jupiter-api' }
junit-jupiter-params = { group = 'org.junit.jupiter', name = 'junit-jupiter-params' }
junit-jupiter-engine = { group = 'org.junit.jupiter', name = 'junit-jupiter-engine' }
junit-platform-launcher = { group = 'org.junit.platform', name = 'junit-platform-launcher' }

tika-core = { group = 'org.apache.tika', name = 'tika-core', version.ref = 'tika' }
tika4-core = { group = 'org.apache.tika', name = 'tika-core', version.ref = 'tika4' }
tika-core-full = { group = 'org.apache.tika', name = 'tika-core', version.ref = 'tika-full' }

publish-on-central-plugin = { group = 'org.danilopianini.publish-on-central', name = 'org.danilopianini.publish-on-central.gradle.plugin', version.ref = 'publish-on-central' }

[plugins]
test-logger = { id = 'com.adarshr.test-logger', version.ref = 'test-logger' }
