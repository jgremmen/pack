[versions]
# pack version
pack = '0.3.1-SNAPSHOT'

jetbrains-annotations = '[19.0,26.2)'
junit = '6.1.+'
tika = '[1.19,4.0)'
tika4 = '[4.0,5.0)'
tika-full = '[1.19,5.0)'  # full version range spanning both tika (3.x) and tika4 (4.x) for pom publication

[libraries]
jetbrains-annotations = { group = 'org.jetbrains', name = 'annotations', version.ref = 'jetbrains-annotations' }

junit-jupiter-api = { group = 'org.junit.jupiter', name = 'junit-jupiter-api', version.ref = 'junit' }
junit-jupiter-params = { group = 'org.junit.jupiter', name = 'junit-jupiter-params', version.ref = 'junit' }
junit-jupiter-engine = { group = 'org.junit.jupiter', name = 'junit-jupiter-engine', version.ref = 'junit' }

tika-core = { group = 'org.apache.tika', name = 'tika-core', version.ref = 'tika' }
tika4-core = { group = 'org.apache.tika', name = 'tika-core', version.ref = 'tika4' }
tika-core-full = { group = 'org.apache.tika', name = 'tika-core', version.ref = 'tika-full' }
